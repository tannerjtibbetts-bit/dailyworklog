<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Burn Plan">
<meta name="description" content="12-week calisthenics, walking and gastric-sleeve-friendly diet plan that adjusts to your weekly weigh-in.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<!--APP-START-->
<title>Burn Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: phone app — sticky header with week strip, one scrolling panel, fixed bottom tab bar. Gym-poster type, phase colors carry through. */
:root{
  --bg:#ECEFEA; --card:#FFFFFF; --ink:#16232C; --muted:#56656E; --line:#D3DAD5; --tint:#E2E8E3;
  --p1:#2F7D74; --p2:#2C6A9E; --p3:#C98A1C; --p4:#B8462F;
  --signal:#E9A23B; --warn:#B8462F; --good:#2F7D74; --on:#FFFFFF;
  --stage:#DCE3DE; --stagefloor:#C7D0CA; --fig:#D9733A; --figjoint:#8E4420; --prop:#9AA8A1;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --card:#18232A; --ink:#E5ECE7; --muted:#9AAAB0; --line:#2C3A42; --tint:#1F2C33;
  --p1:#4FB3A6; --p2:#5C9FD6; --p3:#E3A845; --p4:#E07258;
  --signal:#F0B455; --warn:#E07258; --good:#4FB3A6; --on:#0F171C;
  --stage:#1C2930; --stagefloor:#2A3940; --fig:#F08A4B; --figjoint:#B85A28; --prop:#5E6E73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --card:#18232A; --ink:#E5ECE7; --muted:#9AAAB0; --line:#2C3A42; --tint:#1F2C33;
  --p1:#4FB3A6; --p2:#5C9FD6; --p3:#E3A845; --p4:#E07258;
  --signal:#F0B455; --warn:#E07258; --good:#4FB3A6; --on:#0F171C;
  --stage:#1C2930; --stagefloor:#2A3940; --fig:#F08A4B; --figjoint:#B85A28; --prop:#5E6E73; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
p{margin:0}
.lab{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.p1{--c:var(--p1)}.p2{--c:var(--p2)}.p3{--c:var(--p3);--on:#16232C}.p4{--c:var(--p4)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 8px;display:grid;gap:8px}
.top .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top h1{font-size:30px;font-weight:900}
.top h1 span{color:var(--signal)}
.today{font-family:var(--label);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;border:2px solid var(--ink);background:var(--card);padding:3px 10px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.wkchip{flex:0 0 auto;min-width:48px;border:2px solid var(--c);background:var(--card);padding:3px 6px 2px;display:grid;line-height:1.05;text-align:center;position:relative}
.wkchip small{font-family:var(--label);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.wkchip b{font-family:var(--display);font-size:22px;font-weight:900}
.wkchip[aria-pressed="true"]{background:var(--c);color:var(--on)}
.wkchip[aria-pressed="true"] small{color:var(--on)}
.wkchip.now::after,.daychip.now::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--signal)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daychip{border:0;background:var(--tint);padding:5px 0 4px;display:grid;line-height:1.1;text-align:center;position:relative}
.daychip b{font-family:var(--label);font-weight:700;font-size:15px;text-transform:uppercase}
.daychip small{font-size:11.5px;color:var(--muted)}
.daychip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.daychip[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.daychip.fin b::after{content:" ✓";color:var(--good)}
.daychip[aria-pressed="true"].fin b::after{color:var(--signal)}

/* main */
main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-width:760px;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;border:2px solid var(--ink)}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--label);font-weight:600;font-size:15px}
.gbar span{flex:1 1 auto}
.gbar b{font-family:var(--display);font-size:22px;font-weight:900}
.gsec{gap:0}
.gsec .lab{padding-bottom:4px}
.gi{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.gi .box{width:26px;height:26px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;color:var(--on)}
.gi.on .box{background:var(--good);border-color:var(--good)}
.gi .t{min-width:0;font-weight:600;line-height:1.25}
.gi .t small{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
.gi.on .t{text-decoration:line-through;color:var(--muted)}
.gtext{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:13px;background:var(--card);color:var(--ink);border:2px solid var(--ink);padding:8px}
.seg button{border:0;background:var(--card);padding:9px 2px;font-family:var(--label);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.prep{margin-top:4px;border:1px solid var(--line);background:var(--bg)}
.prep summary{cursor:pointer;padding:7px 10px;font-family:var(--label);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.prep ol{margin:0;padding:0 12px 10px 30px;font-size:14.5px;display:grid;gap:4px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:2px solid var(--ink);padding:14px;display:grid;gap:10px;min-width:0}
.card.flat{border-width:1px;border-color:var(--line)}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:6px 12px;border-bottom:4px solid var(--c);padding-bottom:8px}
.dayhead h2{font-size:32px;font-weight:900;color:var(--c)}
.dayhead .meta{font-family:var(--label);font-weight:600;font-size:15px;color:var(--muted)}
.banner{background:var(--tint);border-left:5px solid var(--signal);padding:9px 12px;font-size:14.5px;display:grid;gap:3px}
.banner.warn{border-left-color:var(--warn)}
.banner.good{border-left-color:var(--good)}
.banner b{font-family:var(--label);text-transform:uppercase;letter-spacing:.06em;font-size:14px}

/* viewer */
.viewer{background:var(--card);border:2px solid var(--ink);display:grid;min-width:0;scroll-margin-top:calc(200px + env(safe-area-inset-top,0px))}
.stagewrap{position:relative;background:var(--stage);aspect-ratio:4/3;max-width:100%;touch-action:pan-y}
.stagewrap canvas{display:block;width:100%;height:100%}
.stagewrap .hint{position:absolute;left:10px;bottom:8px;font-family:var(--label);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.stagewrap .nogl{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted);font-size:14.5px}
.vctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.vctl button{border:2px solid var(--ink);background:var(--card);font-family:var(--label);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px}
.vinfo{padding:12px 14px;display:grid;gap:4px;border-top:2px solid var(--ink)}
.vinfo h3{font-size:24px}
.vinfo .lvl{font-family:var(--label);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.vinfo p{font-size:14.5px;color:var(--muted)}

/* move list */
.sec{display:grid;gap:0}
.sec>.lab{padding:10px 0 4px}
.mv{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.mv .ic{width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--c);color:var(--c);font-size:12px}
.mv.sel .ic{background:var(--c);color:var(--on)}
.mv .ic.none{border-color:var(--line);color:var(--muted)}
.mv span.t{min-width:0;font-weight:600;line-height:1.25}
.mv span.t small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.mv b{font-family:var(--display);font-size:21px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.donebtn{border:2px solid var(--ink);background:var(--card);padding:11px;font-family:var(--label);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.08em}
.donebtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on)}

/* diet */
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.styles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.styles::-webkit-scrollbar{display:none}
.styles button{flex:0 0 auto;border:2px solid var(--ink);background:var(--card);padding:6px 12px;font-family:var(--label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.styles button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#16232C}
.stylebox{display:grid;gap:4px;font-size:14.5px}
.stylebox p{color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink)}
.seg3 button{border:0;background:var(--card);padding:8px 0;font-family:var(--label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#plans{scroll-margin-top:calc(200px + env(safe-area-inset-top,0px))}
.plist{display:grid}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.pl b{font-weight:600}
.pl .kind{font-family:var(--label);font-weight:600;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pl p{grid-column:1/-1;font-size:14px;color:var(--muted)}
@media (min-width:560px){.targets{grid-template-columns:repeat(4,1fr)}}
.tg{background:var(--card);border:2px solid var(--ink);padding:10px;display:grid;gap:2px;min-width:0}
.tg .big{font-family:var(--display);font-size:30px;font-weight:900;line-height:1}
.tg small{font-size:12.5px;color:var(--muted);line-height:1.2}
.meal{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meal .mh .lab{color:var(--c)}
.meal h4{font-size:20px}
.meal ul{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:1px}
.meal .mt{font-family:var(--label);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.meal.shake .lab{color:var(--signal)}
.tot{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--label);font-weight:600;font-size:15px;border-top:3px solid var(--ink);padding-top:8px}
.tot b{font-family:var(--display);font-size:20px;font-weight:900;margin-right:3px}
details.card summary{cursor:pointer;font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
details.card summary::after{content:"+";color:var(--muted)}
details.card[open] summary::after{content:"–"}
.rules{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.snacks{display:grid;gap:0}
.sn{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.sn:first-child{border-top:0}
.sn b{font-weight:600}
.sn .mac{grid-column:1/-1;display:flex;gap:12px;font-family:var(--label);font-weight:600;font-size:13.5px;color:var(--muted)}
.sn .pp{font-family:var(--display);font-weight:900;font-size:19px}

/* forms */
.form{display:grid;gap:12px}
.fld{display:grid;gap:4px}
.fld label{font-family:var(--label);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fld input,.fld select{width:100%;border:2px solid var(--ink);background:var(--card);padding:10px 10px;font-size:17px;border-radius:0}
.fld .hint{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-size:15.5px}
.chk input{width:22px;height:22px}
.primary{border:0;background:var(--ink);color:var(--bg);padding:13px;font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.08em}
.ghost{border:2px solid var(--ink);background:transparent;padding:9px 12px;font-family:var(--label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.danger{border-color:var(--warn);color:var(--warn)}
.weighbox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.weighbox input{font-family:var(--display);font-size:34px;font-weight:900;padding:6px 10px}
.hist{display:grid}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.hrow b{font-family:var(--display);font-size:20px;font-weight:900}
.hrow .chg{font-family:var(--label);font-weight:700}
.hrow .x{border:0;background:none;color:var(--muted);font-size:20px;padding:0 4px}
.down{color:var(--good)}.upc{color:var(--warn)}
.chart{width:100%;height:auto;display:block}
.ptab{width:100%;border-collapse:collapse;font-size:15px}
.ptab th{text-align:left;font-family:var(--label);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 0}
.ptab td{padding:6px 0;border-top:1px solid var(--line)}
.ptab td b{font-family:var(--display);font-size:19px}
.ptab tr.cur td{background:var(--tint)}
.ptab .tag{font-family:var(--label);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--good);border:1.5px solid var(--good);padding:0 4px;margin-left:4px}
.chart text{fill:var(--muted);font-family:var(--label);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:2px;font-family:var(--label);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{stroke:var(--signal)}
.intro h2{font-size:40px;font-weight:900}
.intro h2 span{color:var(--signal)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div id="app">
  <header class="top g" id="top"></header>
  <main class="g" id="main"></main>
  <nav class="nav" id="nav" aria-label="Sections">
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
    <button type="button" data-tab="weigh"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 9a5 5 0 0 1 8 0M12 12l2-3"/></svg>Weigh-in</button>
    <button type="button" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</button>
  </nav>
</div>

<div id="viewerHome" hidden>
  <div class="viewer" id="viewer">
    <div class="stagewrap" id="stage">
      <canvas id="gl" aria-label="Animated 3D demonstration of the selected exercise"></canvas>
      <div class="vctl"><button type="button" id="vview">Side view</button><button type="button" id="vplay">Pause</button></div>
      <span class="hint">Drag to turn</span>
    </div>
    <div class="vinfo" id="vinfo"></div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- plan data ---------- */
var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var PHASE=["Foundation","Build","Burn","Push"];

var PLANK=[15,15,20,20,25,25,30,30,35,35,40,45];

var MARCH=[30,30,30,45,45,45,45,45,45,60,60,60];
var TUE=[15,20,20,25,30,30,35,35,35,40,45,45];
var TUEFAST=[0,0,0,0,0,0,4,5,6,6,8,8];
var THU=[15,20,20,25,30,30,35,40,40,40,45,45];
var CORE_R=[1,1,2,2,2,2,2,3,3,3,3,3];
var DB=[5,5,6,6,7,8,8,8,10,8,10,10];
var SAT=[25,30,30,35,40,40,50,55,60,60,70,75];
var STEPS=[4000,4500,5000,6000,6500,7000,7500,8000,8500,9000,9500,10000];
var ROUNDS=[2,3,3,4], REST=[90,60,45,30], STR=[30,35,40,45], COREMIN=[5,8,10,12];
var LV={
  push:["Wall push-up","Counter push-up","Bench or table push-up","Knee push-up"],
  squat:["Sit-to-stand, hands on knees","Sit-to-stand, arms forward","Chair-tap squat (don't sit)","Low-seat squat"],
  row:["Doorframe row, slight lean","Doorframe row, more lean","Doorframe row, 2-s pause","One-arm doorframe row"],
  bridge:["Glute bridge, 1-s hold","Glute bridge, 3-s hold","Feet-on-step bridge","Single-leg bridge"],
  plank:["Wall plank","Counter plank","Bench plank","Knee plank on floor"],
  step:["Bottom stair, hold rail","Bottom stair, no hands","Bottom stair, faster pace","Second stair"],
  bug:["Dead bug, heel taps","Dead bug, leg straightens","Dead bug, opposite arm + leg","Dead bug, slow 3-s reach"],
  march:["March in place","March in place","Fast march","Fast march"],
  walk:["Easy walk","Brisk walk","Fast burst","Fast or uphill"]
};
var CUES={
  push:"Body straight like a board from heels (or knees) to head. Lower your chest to the edge, then push away. Breathe out as you push.",
  squat:"Sit back like you're reaching for the chair. Chest up, knees over toes. Stand by pushing through your heels.",
  row:"Grip both sides of a solid door frame. Lean back with a straight body, pull your chest to your hands and squeeze your shoulder blades.",
  bridge:"Lie on your back, feet flat. Push through your heels and squeeze your glutes at the top. Don't arch your lower back.",
  plank:"Elbows under shoulders, body straight, stomach braced like someone is about to poke it. Breathe slowly.",
  step:"Whole foot on the step. Stand tall at the top, then step down slowly. Lead with one leg for half the time, then switch.",
