<html lang="en">

<meta name="theme-color" content="#0F1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Work Log">
<title>Daily Work Log</title>

<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{
  --bg:#EAF2FB; --card:#fff; --stroke:#D3E1F1; --navy:#0F1A2B; --text:#111827; --grey:#55667D; --grey2:#8FA1B8;
  --blue:#1268D6; --deep:#174A8B; --sky:#DCEBFB; --chip:#DAE6F4; --green:#1DB04B; --green-bg:#F3FBF6; --green-stroke:#C9EBD5;
  --red:#E5484D; --yellow:#F2C200; --intro:#0F1A2B;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:var(--safe-t);
  animation:pushIn .28s cubic-bezier(.2,.8,.2,1)}
.screen.back{animation:popIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pushIn{from{transform:translateX(28%);opacity:.4}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-18%);opacity:.4}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(140px + var(--safe-b))}
.top{display:flex;align-items:center;gap:6px;min-height:64px;padding:0 8px;position:relative}
.top h1{flex:1;margin:0 0 0 6px;font-size:26px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn:active{background:rgba(23,74,139,.1)}
.ic{width:26px;height:26px;fill:currentColor;display:block}
.ic.sm{width:18px;height:18px}
.big{font-size:34px;font-weight:800;color:var(--navy);margin:14px 24px 0;letter-spacing:-.5px}
.sub{color:var(--grey);font-size:16px;margin:2px 24px 0}
.pin{display:flex;align-items:center;gap:4px;color:var(--grey);font-size:15px}
.list{padding:18px 18px 0}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;
  margin-bottom:12px;width:100%;text-align:left;transition:transform .12s}
.card:active{transform:scale(.985)}
.card .t{font-size:20px;font-weight:700;color:var(--navy)}
.card .s{font-size:15px;color:var(--grey);margin-top:3px}
.grow{flex:1;min-width:0}
.soft{width:52px;height:52px;border-radius:16px;background:var(--sky);display:grid;place-items:center;color:var(--deep);flex:none}
.fab{position:absolute;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);width:156px;height:70px;border-radius:40px;
  background:var(--deep);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(15,26,43,.25);z-index:5}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab.blue{background:var(--blue);width:150px}
.pills{display:flex;gap:8px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.pill{padding:11px 20px;border-radius:40px;background:#fff;border:1px solid var(--stroke);font-size:17px;white-space:nowrap}
.pill.on{background:var(--deep);border-color:var(--deep);color:#fff}
.search{margin:16px 20px 0;height:58px;border-radius:30px;background:#fff;border:1px solid var(--stroke);display:flex;align-items:center;padding:0 18px;gap:12px}
.search input{flex:1;border:0;outline:0;font-size:17px;background:none;min-width:0}
.empty{color:var(--grey);text-align:center;padding:40px 28px;font-size:17px;line-height:1.5;white-space:pre-line}
.badges{display:flex;flex:none}
.badge{width:42px;height:42px;border-radius:50%;background:var(--sky);border:2px solid #fff;color:var(--deep);font-weight:700;font-size:14px;
  display:grid;place-items:center;margin-left:-8px}
.badges .badge:first-child{margin-left:0}
.ring{flex:none;display:block}
/* checklist */
.loghead{padding:2px 0 0}
.loghead .row{display:flex;gap:18px;padding:12px 24px 0;align-items:flex-start}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 20px 14px;scrollbar-width:none}
.chip{padding:11px 20px;border-radius:40px;background:var(--chip);color:var(--grey);font-size:17px;white-space:nowrap}
.chip.on{background:var(--deep);color:#fff}
.divider{height:1px;background:var(--stroke);margin:16px 24px 0}
.task{margin:0 14px 12px;background:#fff;border:1px solid var(--stroke);border-radius:22px;display:flex;overflow:hidden;
  transition:background .2s,border-color .2s}
.task.done{background:var(--green-bg);border-color:var(--green-stroke)}
.task .bar{width:5px;background:var(--sky);flex:none}
.task.done .bar{background:var(--green)}
.task .body{flex:1;min-width:0;padding:16px 10px 16px 14px}
.task .line1{display:flex;align-items:flex-start;gap:12px}
.task .title{flex:1;font-size:21px;font-weight:700;color:var(--navy);line-height:1.25;padding-top:5px;word-wrap:break-word;min-width:0}
.check{width:38px;height:38px;flex:none;border-radius:50%;border:2.4px solid #9DB4CF;display:grid;place-items:center;background:#fff;transition:all .15s}
.check svg{width:22px;height:22px;opacity:0;transform:scale(.4);transition:all .2s}
.check.on{background:var(--green);border-color:var(--green)}
.check.on svg{opacity:1;transform:scale(1)}
.check.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.act{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--blue);flex:none}
.indent{margin-left:50px}
.meta{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--grey2);margin-top:8px}
.meta.blue{color:var(--blue)}
.notes{font-size:18px;margin-top:10px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.tag{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px;border-radius:40px;font-size:15px;margin-right:6px}
.tag.req{background:#EEF4FB;border:1.5px solid #C7D7EA}
.tag.req.miss{color:var(--red)}
.tag.sec{background:#E6F6EC;color:#148A3A;font-weight:600}
.thumbs{display:flex;gap:10px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.thumbs img{width:100px;height:100px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}
.newfield{display:flex;align-items:center;gap:14px;color:var(--blue);font-size:23px;padding:16px 28px}
.toptitle{position:absolute;left:64px;right:64px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transition:opacity .16s;pointer-events:none}
.toptitle.show{opacity:1}
.toptitle .p{font-size:12px;letter-spacing:.06em;color:var(--grey);text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toptitle .l{font-size:18px;color:var(--navy);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* edit field */
.editcard{margin:0 14px 24px;background:#fff;border:1px solid var(--stroke);border-radius:22px;padding:8px 20px 16px}
.edittitle{flex:1;border:0;outline:0;font-size:27px;font-weight:700;color:var(--navy);resize:none;background:none;padding:6px 0;min-width:0}
.editnotes{flex:1;border:0;outline:0;font-size:19px;resize:none;background:none;min-height:60px;line-height:1.4;min-width:0}
.hr{height:1px;background:var(--stroke)}
.rowbtn{display:flex;align-items:center;gap:14px;width:100%;padding:20px 0;color:var(--blue);font-size:22px}
.person{display:flex;align-items:center;gap:14px;padding:0 0 14px;font-size:19px;width:100%}
.person .badge{margin:0}
.switch{position:relative;width:52px;height:32px;border-radius:20px;background:#C7D3E2;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--blue)}
.switch.on::after{transform:translateX(20px)}
.ptile{position:relative;flex:none;padding:10px 10px 0 0}
.ptile img{width:140px;height:140px;border-radius:12px;object-fit:cover;display:block;background:var(--chip)}
.ptile .rm{position:absolute;top:0;right:0;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.addtile{width:140px;height:140px;margin-top:10px;border-radius:12px;border:2px dashed #9DB7D8;background:#F2F7FD;display:grid;place-items:center;color:var(--blue);flex:none}
.box{width:28px;height:28px;border-radius:7px;border:2.4px solid #9DB4CF;display:grid;place-items:center;flex:none;transition:all .15s}
.box.on{background:var(--green);border-color:var(--green)}
.box svg{width:20px;height:20px;opacity:0}.box.on svg{opacity:1}
.danger{color:var(--red);display:flex;align-items:center;gap:12px;font-size:18px;padding:14px 0}
/* sheets & dialogs */
.scrim{position:fixed;inset:0;background:rgba(15,26,43,.42);z-index:50;animation:fade .2s}
.scrim.closing{animation:fadeOut .2s forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;z-index:51;
  padding:10px 22px calc(26px + var(--safe-b));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet.closing{animation:down .2s forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.handle{width:44px;height:5px;border-radius:3px;background:#C2D2E6;margin:4px auto 14px}
.sheet .cap{color:var(--grey);font-size:16px;margin-bottom:8px}
.srow{display:flex;align-items:center;gap:20px;width:100%;padding:8px 0;font-size:20px;font-weight:500;text-align:left}
.srow .tile{width:64px;height:64px;border-radius:18px;background:#F2F7FD;border:1px solid var(--stroke);display:grid;place-items:center;color:var(--deep);flex:none}
.srow.danger{color:var(--red)}.srow.danger .tile{color:var(--red)}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#fff;border-radius:26px;z-index:61;padding:24px;
  animation:dlg .2s cubic-bezier(.2,.8,.2,1)}
@keyframes dlg{from{opacity:0;transform:translate(-50%,-46%)}}
.dialog h2{margin:0 0 6px;font-size:22px;font-weight:600}
.dialog p{margin:0 0 6px;color:var(--grey);line-height:1.45}
.field{width:100%;border:0;border-bottom:2px solid var(--stroke);outline:0;font-size:18px;padding:12px 2px;margin-top:8px;background:none}
.field:focus{border-color:var(--blue)}
.field.err{border-color:var(--red)}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn{padding:12px 18px;border-radius:22px;font-size:17px;font-weight:600;color:var(--blue)}
.btn.fill{background:var(--blue);color:#fff}
.btn.red{color:var(--red)}
.assignhead{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.assignhead b{font-size:21px;color:var(--navy)}
.urow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 4px;font-size:19px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translateX(-50%);background:#1E2A3B;color:#fff;border-radius:14px;
  padding:14px 18px;z-index:70;display:flex;align-items:center;gap:16px;max-width:92vw;font-size:16px;animation:up .25s}
.toast button{color:#8DC2FF;font-weight:700;white-space:nowrap}
.viewer{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;justify-content:center;animation:fade .2s}
.viewer img{width:100%;max-height:85vh;object-fit:contain}
.viewer .c{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(24px + var(--safe-b));color:#fff;background:rgba(0,0,0,.6)}
.busy{position:fixed;inset:0;z-index:90;background:rgba(15,26,43,.42);display:grid;place-items:center}
.busy div{background:#fff;border-radius:20px;padding:22px 26px;font-size:17px;display:flex;gap:14px;align-items:center}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--sky);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* intro */
.intro{position:absolute;inset:0;background:var(--intro);color:#fff;display:flex;flex-direction:column;align-items:center;
  padding:calc(24px + var(--safe-t)) 24px calc(30px + var(--safe-b));text-align:center;overflow-y:auto}
.intro .logo{width:min(230px,58vw);height:auto;animation:logoIn .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-20deg)}}
.intro .name{font-size:40px;font-weight:900;margin-top:24px;letter-spacing:-.5px}
.intro .ul{width:64px;height:4px;background:var(--yellow);border-radius:2px;margin-top:14px;animation:grow .4s .5s both}
@keyframes grow{from{transform:scaleX(0)}}
.intro .tagline{color:var(--grey2);font-size:14px;letter-spacing:.2em;margin-top:14px}
.intro .mlabel{color:var(--yellow);font-size:12px;letter-spacing:.2em;margin-top:30px}
.intro .mission{color:#D3DCE7;font-size:17px;line-height:1.45;max-width:340px;margin-top:8px}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
.enter{width:min(300px,84vw);height:64px;border-radius:40px;background:var(--yellow);color:#14233A;font-size:21px;font-weight:700;margin-top:auto}
.enter:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

const Fmt = {
  logDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); return m?`${m[3]}/${m[2]}/${m[1]}`:(iso||""); },
  time(d){ let h=d.getHours(); const ap=h<12?"AM":"PM"; h=h%12||12; return `${h}:${pad(d.getMinutes())} ${ap}`; },
  stamp(t){ const d=new Date(t); return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()} at ${Fmt.time(d)}`; },
  longStamp(t){ const d=new Date(t); const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
    return `${m} ${d.getDate()}, ${d.getFullYear()} at ${Fmt.time(d)}`; },
  today(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; },
  initials(n){ const p=String(n).trim().split(/\s+/).filter(Boolean); if(!p.length) return "?";
    return (p[0][0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase(); },
  plural(n,one,many){ return `${n} ${n===1?one:many}`; },
  cap(s){ s=String(s).trim(); return s?s[0].toUpperCase()+s.slice(1):s; },
  fileSafe(s){ return (String(s).replace(/[^A-Za-z0-9 _-]/g,"-").trim())||"report"; }
};

/* ---------- storage: IndexedDB for data + photo blobs, memory fallback ---------- */
const Store = {
  db:null, mem:{kv:{},photos:{}},
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{ const r=indexedDB.open("dailyworklog",1);
        r.onupgradeneeded=()=>{ r.result.createObjectStore("kv"); r.result.createObjectStore("photos"); };
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    }catch(e){ this.db=null; }
  },
  tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const s=t.objectStore(store);
    const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); },
  async get(store,key){ if(!this.db) return this.mem[store][key]; try{ return await this.tx(store,"readonly",s=>s.get(key)); }catch(e){ return undefined; } },
  async put(store,key,val){ if(!this.db){ this.mem[store][key]=val; return; } try{ await this.tx(store,"readwrite",s=>s.put(val,key)); }catch(e){ this.mem[store][key]=val; } },
  async del(store,key){ if(!this.db){ delete this.mem[store][key]; return; } try{ await this.tx(store,"readwrite",s=>s.delete(key)); }catch(e){} }
};

/* ---------- photo helpers ---------- */
const urlCache = new Map();
async function photoURL(id){
  if(urlCache.has(id)) return urlCache.get(id);
  const b = await Store.get("photos", id); if(!b) return "";
  const u = URL.createObjectURL(b); urlCache.set(id,u); return u;
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function processPhoto(file, max=1600){
  const src = URL.createObjectURL(file);
  try{
    const img = await loadImg(src);  // browsers apply camera rotation automatically
    const s = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  } finally { URL.revokeObjectURL(src); }
}
async function addPhotos(task, files){
  busy(true,"Adding photos…");

  for(const f of files){
    try{ const blob=await processPhoto(f); const id=uid(); await Store.put("photos",id,blob);
      task.photos.push({file:id,addedBy:me(),addedAt:Date.now()}); }catch(e){ failed++; }
  }
  busy(false); save(); render();
  if(failed) toast("Some photos couldn't be added");
}

    `<div class="btns"><button class="btn" data-x>Cancel</button><button class="btn fill" data-ok>${esc(okLabel)}</button></div>`);
  const ins=[...d.querySelectorAll("input")];
  const ok=()=>{ const out={}; let bad=false;
    ins.forEach((el,i)=>{ const v=el.value.trim(); out[fields[i].key]=v; if(fields[i].required&&!v){ el.classList.add("err"); el.placeholder="Required"; bad=true; } });
    if(bad) return; close(); cb(out); };
  ins.forEach(el=>{ el.oninput=()=>el.classList.remove("err"); el.onkeydown=e=>{ if(e.key==="Enter") ok(); }; });
  d.querySelector("[data-ok]").onclick=ok; d.querySelector("[data-x]").onclick=close;
  setTimeout(()=>{ ins[0].focus(); try{ const v=ins[0].value; ins[0].setSelectionRange(v.length,v.length); }catch(e){} },80);

/* ---------- navigation (hash routes, so the iPhone swipe-back gesture works) ---------- */
const depthOf = r => ({intro:0,projects:1,project:2,log:3,task:4})[r.name] ?? 1;
function route(){
  const h=location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="projects") return {name:"projects"};
  if(h[0]==="p") return {name:"project",pid:h[1]};
  if(h[0]==="l") return {name:"log",pid:h[1],lid:h[2]};
  if(h[0]==="t") return {name:"task",pid:h[1],lid:h[2],tid:h[3]};
  return {name:"intro"};
}
const go = path => { location.hash = path; };
const back = () => { if(history.length>1) history.back(); else go("/projects"); };
let lastKey="", lastDepth=0, ui={tab:"logs",query:"",filter:0};
window.addEventListener("hashchange", ()=>render());

function render(){
  const r=route(); const key=location.hash; const app=$("#app");
  const same = key===lastKey; const old=app.querySelector(".scroll"); const keep= same && old ? old.scrollTop : 0;
  const dir = depthOf(r) < lastDepth ? "back" : "";
  let html="";
  if(r.name==="intro") html=introView();
  else if(r.name==="projects") html=projectsView();
  else if(r.name==="project") html=projectView(r);
  else if(r.name==="log") html=logView(r);
  else if(r.name==="task") html=taskView(r);
  if(html===null){ go("/projects"); return; }
  app.innerHTML=html;
  const scr=app.firstElementChild;
  if(same) scr.style.animation="none"; else if(dir) scr.classList.add("back");
  const sc=app.querySelector(".scroll"); if(sc) sc.scrollTop=keep;
  lastKey=key; lastDepth=depthOf(r);
  bind(r);
  hydrateImages();
}

      ? `<svg class="ring" width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#1DB04B"/><path d="M32 51L45 64L69 38" fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg class="ring" width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#1DB04B" stroke-width="8"/><path d="M32 51L45 64L69 38" fill="none" stroke="#1DB04B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  return `<svg class="ring" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="#D3E1F1" stroke-width="${sw}"/>
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="#1268D6" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${s/2} ${s/2})" style="transition:stroke-dashoffset .4s"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${s*0.25}" font-weight="700" fill="#0F1A2B">${Math.round(p*100)}%</text></svg>`;

/* ---------- texting a task to the people assigned ---------- */
function taskText(p,l,t){
  let s=`${logTitle(l)}${p.name?` (${p.name})`:""}\nAssigned to you: ${t.title}`;
  if(t.notes.trim()) s+=`\nNotes: ${t.notes.trim()}`;
  if(t.photosRequired) s+=`\nPhotos required.`;
  if(t.photos.length) s+=`\n${Fmt.plural(t.photos.length,"photo","photos")} attached.`;
  return s+`\n\n- ${me()}`;
}
async function textTask(p,l,t,name){
  const phone=(p.phones||{})[name]||"";
  const body=taskText(p,l,t);
  if(t.photos.length && navigator.canShare){
    try{
      const files=[]; for(const [i,ph] of t.photos.entries()){ const b=await Store.get("photos",ph.file); if(b) files.push(new File([b],`photo-${i+1}.jpg`,{type:"image/jpeg"})); }
      if(files.length && navigator.canShare({files,text:body})){ await navigator.share({files,text:body}); return; }
    }catch(e){ if(e && e.name==="AbortError") return; }
  }
  if(phone){ location.href=`sms:${phone.replace(/[^\d+]/g,"")}?&body=${encodeURIComponent(body)}`; return; }
  if(!t.photos.length){ p.phones=p.phones||{};
    prompt2(`Phone number for ${name}`,[{key:"v",hint:"e.g. 519-555-0123",type:"tel",required:true}],"Save and text",o=>{ p.phones[name]=o.v; save(); render();
      location.href=`sms:${o.v.replace(/[^\d+]/g,"")}?&body=${encodeURIComponent(body)}`; }); return; }
  try{ await navigator.clipboard.writeText(body); toast(`No number saved for ${name}. Message copied, so you can paste it into a text.`,"Add number",()=>editPhone(p,name)); }
  catch(e){ toast(`Add a phone number for ${name} first`,"Add number",()=>editPhone(p,name)); }
}
function editPhone(p,name){
  p.phones=p.phones||{};
  prompt2(`Phone number for ${name}`,[{key:"v",hint:"e.g. 519-555-0123",value:p.phones[name]||"",type:"tel"}],"Save",o=>{ p.phones[name]=o.v; save(); render(); });
}
function crewSheet(p){
  p.phones=p.phones||{};
  const items=p.crew.map(n=>({icon:"person",label:`${n}${p.phones[n]?`  ·  ${p.phones[n]}`:"  (no number)"}`,run:()=>editPhone(p,n)}));
  items.push({icon:"add",label:"Add crew member",run:()=>prompt2("Add crew member",[{key:"n",hint:"Full name",required:true},{key:"ph",hint:"Phone number (optional)",type:"tel"}],"Add",o=>{
    const n=Fmt.cap(o.n); if(!p.crew.includes(n)) p.crew.push(n); if(o.ph) p.phones[n]=o.ph; save(); render(); })});
  menu("Crew and phone numbers. Tap a name to set their number.",items);
}

/* ---------- email report to a saved list ---------- */
function emailList(p){
  prompt2("Report email list",[{key:"e",hint:"Emails, separated by commas",value:(p.emails||[]).join(", "),type:"email"}],"Save",o=>{
    p.emails=o.e.split(/[\s,;]+/).map(x=>x.trim()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)); save();
    toast(p.emails.length?`Saved ${Fmt.plural(p.emails.length,"address","addresses")}`:"Email list cleared"); });
}
async function emailReport(p,l){
  if(!(p.emails||[]).length){ toast("Add your report email list first","Add emails",()=>emailList(p)); return; }
  busy(true,"Building PDF report…");
  let blob; try{ blob=await buildPdf(p,l); }catch(e){ busy(false); toast("Couldn't build the report. Please try again."); return; }
  busy(false);
  const name=Fmt.fileSafe(logTitle(l))+".pdf", to=p.emails.join(", ");
  const subject=`${logTitle(l)}${p.name?` - ${p.name}`:""}`;
  const bodyTxt=`${subject}: ${doneCount(l)}/${l.tasks.length} fields completed.\nReport attached.\n\n${me()}`;
  // Second tap is needed: iPhones only allow sharing straight from a tap.
  const [d,close]=dialog(`<h2>Report ready</h2><p>Tap Open email, choose Mail or Outlook, then tap the To line and Paste. Your ${Fmt.plural(p.emails.length,"address is","addresses are")} copied.</p>
    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn fill" data-ok>Open email</button></div>`);
  d.querySelector("[data-x]").onclick=close;
  d.querySelector("[data-ok]").onclick=async()=>{
    close();
    try{ await navigator.clipboard.writeText(to); }catch(e){}
    const file=new File([blob],name,{type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:subject,text:bodyTxt}); return; }catch(e){ if(e&&e.name==="AbortError") return; }
    }
    // Computers: save the PDF, then open a new email addressed to the list
    await deliver(blob,name,"application/pdf");
    location.href=`mailto:${encodeURIComponent(to).replace(/%2C/g,",").replace(/%20/g,"")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyTxt+"\n\n(Attach the PDF that was just saved.)")}`;
  };
}

/* ---------- actions ---------- */
function toggle(p,l,t,el){
  if(!t.done && t.photosRequired && !t.photos.length){
    navigator.vibrate&&navigator.vibrate(30);
    toast("This field needs a photo before it can be completed","Take photo",()=>pickPhoto(t,true)); return;
  }
  t.done=!t.done; t.completedBy=t.done?me():""; t.completedAt=t.done?Date.now():0; save();
  navigator.vibrate&&navigator.vibrate(12); render();
  const c=document.querySelector(`[data-check="${t.id}"]`); if(c){ c.classList.add("pop"); }
}
function addTask(l,title){ const t=newTask(Fmt.cap(title)); l.tasks.push(t); save(); render();
  if(!matches(t)) toast("Field added. Clear the filter to see it.");
  else setTimeout(()=>{ const sc=$(".scroll"); sc&&sc.scrollTo({top:sc.scrollHeight,behavior:"smooth"}); },50); }
function voiceAdd(l){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ ask("New field","Tap the mic on your keyboard to dictate","","Add",v=>addTask(l,v)); return; }
  try{ const r=new SR(); r.lang="en-CA"; r.interimResults=false; r.maxAlternatives=1;
    toast("Listening… say the new field");
    r.onresult=e=>{ const v=e.results[0][0].transcript; if(v) addTask(l,v); };
    r.onerror=()=>ask("New field","Tap the mic on your keyboard to dictate","","Add",v=>addTask(l,v));
    r.start(); }catch(e){ ask("New field","Tap the mic on your keyboard to dictate","","Add",v=>addTask(l,v)); }
}
function startLog(p,iso,source,unfinished){
  const lat=latestLog(p);
  const l={id:uid(),date:iso,name:"",createdAt:Date.now(),crew:lat?[...lat.crew]:[],tasks:[]};
  (source||[]).forEach(t=>{ if(unfinished&&t.done) return; l.tasks.push(unfinished?carryCopy(t):freshCopy(t)); });
  p.logs.push(l); save(); go(`/l/${p.id}/${l.id}`);
}
function newLog(p,tmpl){
  pickDate(iso=>{
    if(tmpl) return startLog(p,iso,tmpl.tasks,false);
    const lat=latestLog(p);
    if(!lat && !p.templates.length) return startLog(p,iso,null,false);
    const items=[{icon:"add",label:"Blank checklist",run:()=>startLog(p,iso,null,false)}];
    if(lat){ const open=lat.tasks.length-doneCount(lat), from=Fmt.logDate(lat.date);
      if(open) items.push({icon:"carry",label:`Carry over ${Fmt.plural(open,"unfinished field","unfinished fields")} from ${from}`,run:()=>startLog(p,iso,lat.tasks,true)});
      if(lat.tasks.length) items.push({icon:"copy",label:`Copy all fields from ${from}`,run:()=>startLog(p,iso,lat.tasks,false)}); }
    p.templates.forEach(t=>items.push({icon:"tmpl",label:`Template: ${t.name}`,run:()=>startLog(p,iso,t.tasks,false)}));
    menu(`Start the ${Fmt.logDate(iso)} log with`,items);
  });
}

function editLink(existing){

function editProject(p){
  prompt2(p?"Edit project":"New project",[{key:"n",hint:"Project name, e.g. B44 Zone 2 Tool Readiness",value:p?p.name:"",required:true},{key:"loc",hint:"Location, e.g. Kincardine, ON",value:p?p.location:""}],p?"Save":"Create",o=>{

    push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");

    const xref=len; push(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join(""));
    push(`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(chunks,{type:"application/pdf"}); }
}
async function buildPdf(p,l){
  const pdf=new Pdf(logTitle(l)), M=pdf.M, W=pdf.W-2*M; const d=doneCount(l), tot=l.tasks.length;
  if(p.name) pdf.block(p.name.toUpperCase(),8.5,false,"6B7685",M,W,4);
  pdf.block(logTitle(l),22,true,"14233A",M,W,6);
  if(p.location) pdf.block(p.location,10,false,"6B7685",M,W,2);
  pdf.block(`Generated ${Fmt.longStamp(Date.now())} by ${me()}`,10,false,"6B7685",M,W,14);
  pdf.block(`${d}/${tot} fields completed`,13,true,"14233A",M,W,6);
  pdf.rect(M,pdf.y,W,6,"E4E7EC"); if(tot&&d) pdf.rect(M,pdf.y,W*d/tot,6,"1DB04B"); pdf.y+=14;
  if(people(l).length) pdf.block(`Crew: ${people(l).join(", ")}`,10,false,"6B7685",M,W,4);
  pdf.y+=8; pdf.line(M,pdf.y,M+W,"E2E6EB"); pdf.y+=16;
  for(const t of l.tasks){
    const x=M+24, w=pdf.W-M-x; const lines=pdf.wrap(t.title||"(Untitled field)",13,true,w);
    pdf.ensure(lines.length*16.25+40);
    const cy=pdf.y+8.5; if(t.done){ pdf.circle(M+8,cy,7.5,"1DB04B",true); pdf.tick(M+8,cy); } else pdf.circle(M+8,cy,6.8,"A3ACB7",false);
    pdf.block(t.title||"(Untitled field)",13,true,"14233A",x,w,3);
    if(t.done) pdf.block(`Completed by ${t.completedBy}, ${Fmt.stamp(t.completedAt)}`,8.5,false,"6B7685",x,w,2);
    else pdf.block("Not completed",8.5,false,"D93B3F",x,w,2);
    if(t.loadSecured) pdf.block(`Load securement completed${t.securedBy?` by ${t.securedBy}, ${Fmt.stamp(t.securedAt)}`:""}`,8.5,true,"148A3A",x,w,2);
    if(t.assignees.length) pdf.block(`Assigned: ${t.assignees.join(", ")}`,8.5,false,"6B7685",x,w,2);
    if(t.notes.trim()){ pdf.y+=4; pdf.block(t.notes.trim(),10.5,false,"1B2533",x,w,2); }
    if(t.photosRequired&&!t.photos.length) pdf.block("Photos required: none attached",8.5,false,"D93B3F",x,w,2);
    if(t.photos.length){ pdf.y+=8; const gap=12, colW=(w-gap)/2, boxH=175;
      for(let i=0;i<t.photos.length;i+=2){ pdf.ensure(boxH+22);
        for(let j=i;j<Math.min(i+2,t.photos.length);j++){ const ph=t.photos[j], left=x+(j-i)*(colW+gap); const e=await jpegFor(ph.file,900);
          if(!e){ pdf.text("(Photo missing)",8.5,false,"D93B3F",left,pdf.y+12); continue; }
          const s=Math.min(colW/e.w,boxH/e.h), dw=e.w*s, dh=e.h*s; pdf.image(e,left,pdf.y,dw,dh);
          pdf.text(`${ph.addedBy}, ${Fmt.stamp(ph.addedAt)}`,7.5,false,"8A94A1",left,pdf.y+dh+11); }
        pdf.y+=boxH+22; } }
    pdf.y+=10; pdf.ensure(12); pdf.line(M,pdf.y,M+W,"E2E6EB"); pdf.y+=16;
  }
  return pdf.blob();
}
async function deliver(blob,filename,mime){
  const file=new File([blob],filename,{type:mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:filename}); return; }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  try{ if(window.claude&&window.claude.use){ const dl=await window.claude.use("downloads"); if(dl){ await dl.save({filename,data:blob}); return; } } }catch(e){ if(e&&e.code==="declined") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
}
async function exportReport(p,l,word){
  busy(true, word?"Building Word report…":"Building PDF report…");
  try{ const blob= word? await buildDocx(p,l) : await buildPdf(p,l);
    busy(false); await deliver(blob, Fmt.fileSafe(logTitle(l))+(word?".docx":".pdf"), word?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":"application/pdf");
  }catch(e){ busy(false); console.error(e); toast("Couldn't build the report. Please try again."); }
}

  $("#camIn").onchange=onPick; $("#galIn").onchange=onPick;
  if(location.hash && location.hash!=="#") history.replaceState(null,"",location.pathname+location.search);
  render();
  // Offline support, and ask the phone to keep this app's data even when storage runs low
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
